[workspace]
resolver = "2"
members = ["core", "installer", "rev_a", "rev_d", "rev_f", "xtask", "vendor/nice-plug-au2"]
# Vendored with workspaces of their own. They are built as path dependencies
# of this one, never as members of it.
exclude = ["vendor/baseview", "vendor/vizia", "vendor/vizia_plug"]

[workspace.package]
version = "0.16.0"
edition = "2021"
authors = ["Simon Huber <huber.simon@protonmail.com>"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# nih-plug used to flush denormals on every process call; nice-plug only does
# so behind this feature. The release stages and the detector decay towards
# zero for as long as the input is silent, which is exactly where denormals
# appear.
nice-plug = { git = "https://codeberg.org/RustAudio/nice-plug", rev = "e60b5db09d8606c3dc3e93f982847a00bce17325", features = ["unsafe_flush_denormals"] }
# The Vizia 0.4 adapter, ported to this nice-plug. See vendor/vizia_plug/PATCHES.md.
vizia_plug = { path = "vendor/vizia_plug" }
nice-plug-au2 = { path = "vendor/nice-plug-au2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
comp76fx_core = { path = "core" }

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3

# One audited window backend shared by Vizia and its plugin adapter, with the
# Windows input/resize and X11 frame fixes in vendor/baseview/PATCHES.md.
[patch.crates-io]
baseview = { path = "vendor/baseview" }
