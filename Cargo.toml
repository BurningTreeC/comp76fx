[workspace]
resolver = "2"
members = ["core", "installer", "rev_a", "rev_d", "rev_f", "xtask"]
exclude = ["vendor/baseview"]

[workspace.package]
version = "0.11.0"
edition = "2021"
authors = ["Simon Huber <huber.simon@protonmail.com>"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
# The GUI backend vizia uses, which the patch below points at
# `vendor/baseview`. Named directly only for its text-entry switch, which tells
# it on Windows that the preset-name box wants the keyboard.
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "2c1b1a7b0fef1a29a5150a6a8f6fef6a0cbab8c4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
comp76fx_core = { path = "core" }

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3

# Preserve the pinned GUI backend, with Windows input and resize fixes vendored.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "vendor/baseview" }
