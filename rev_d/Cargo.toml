[package]
name = "comp76fx_rev_d"
description = "Comp76Fx Rev D, a model of the D revision of the classic FET limiting amplifier"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# A host-less window for trying the panel out; not part of the plugin build.
standalone = ["nice-plug/standalone"]

[[bin]]
name = "comp76fx_rev_d"
required-features = ["standalone"]

[dependencies]
nice-plug.workspace = true
comp76fx_core.workspace = true

# AUv2 is a macOS-only plugin format. Keeping this target-specific keeps
# CoreAudio and AppKit out of the Linux and Windows builds.
[target.'cfg(target_os = "macos")'.dependencies]
nice-plug-au2 = { workspace = true, features = ["external-view-factory"] }

# Compiles this revision's own Audio Unit view factory on macOS.
[build-dependencies]
cc = "1"
